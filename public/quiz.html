<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀴즈 생성기 | 수업 준비 도우미</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>수업 준비 도우미</h1>
      <nav aria-label="기능">
        <ul>
          <li><a href="quiz.html" aria-current="page">퀴즈 생성기</a></li>
          <li><a href="activity.html">학습활동 추천</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main">
      <h2>퀴즈 생성기</h2>
      <div class="layout">
        <section class="card" aria-labelledby="form-title">
          <h3 id="form-title">입력</h3>
          <form id="input-form" data-title="퀴즈" data-kind="quiz" novalidate>
            <div class="field">
              <label for="subject">과목 <span class="req">필수</span></label>
              <input id="subject" name="subject" type="text" required data-label="과목">
            </div>
            <div class="field">
              <label for="grade">학년 <span class="req">필수</span></label>
              <select id="grade" name="grade" required data-label="학년">
                <option value="">선택하세요</option>
                <option>초1</option><option>초2</option><option>초3</option>
                <option>초4</option><option>초5</option><option>초6</option>
                <option>중1</option><option>중2</option><option>중3</option>
                <option>고1</option><option>고2</option><option>고3</option>
              </select>
            </div>
            <div class="field">
              <label for="topic">주제 <span class="req">필수</span></label>
              <input id="topic" name="topic" type="text" required data-label="주제">
            </div>
            <div class="field">
              <label for="count">문항 수 <span class="req">필수</span></label>
              <input id="count" name="count" type="number" min="1" max="20" value="5" required data-label="문항 수">
            </div>
            <fieldset>
              <legend>문항 유형 <span class="req">필수</span></legend>
              <div class="options">
                <label><input type="radio" name="type" value="객관식" required data-label="문항 유형"> 객관식</label>
                <label><input type="radio" name="type" value="단답형" required data-label="문항 유형"> 단답형</label>
                <label><input type="radio" name="type" value="혼합" required data-label="문항 유형"> 혼합</label>
              </div>
            </fieldset>
            <div class="field">
              <label for="passage">참고 지문</label>
              <textarea id="passage" name="passage" rows="6" data-label="참고 지문"></textarea>
            </div>
            <button class="primary" type="submit">만들기</button>
          </form>
        </section>
        <section class="card result-card" aria-labelledby="result-title">
          <h3 id="result-title">결과</h3>
          <div id="result" aria-live="polite">
            <p class="empty">아직 결과가 없습니다. 왼쪽 입력을 채우고 만들기를 누르세요.</p>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="js/form-check.js"></script>
  <script src="app.js"></script>
</body>
</html>
