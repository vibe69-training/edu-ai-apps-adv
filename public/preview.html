<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결과 카드 미리보기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="main">
    <h2>결과 카드 미리보기</h2>
    <div class="cards">
      <article class="card">
        <h3>퀴즈 문항 1</h3>
        <p>물이 끓어 기체가 되는 현상은?</p>
        <ol class="choices">
          <li>증발</li>
          <li>응결</li>
          <li>승화</li>
          <li>융해</li>
        </ol>
        <details class="answer">
          <summary>정답 보기</summary>
          <p>정답: 1번 증발. 끓는 점에서 일어나는 기화 현상이다.</p>
        </details>
      </article>

      <article class="card">
        <h3>상태 변화 카드 짝 맞추기</h3>
        <dl class="result-card">
          <dt>목표</dt>
          <dd>물질의 상태 변화 용어를 현상과 연결한다</dd>
          <dt>준비물</dt>
          <dd>상태 변화 카드</dd>
          <dt>시간</dt>
          <dd>10분</dd>
        </dl>
      </article>
    </div>
  </main>
</body>
</html>
